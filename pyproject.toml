[build-system]
requires = ["numpy", "wheel", "meson-python", "meson>=1.7.0"]
build-backend = "mesonpy"

[project]
name = "uclchem"
dynamic = ["version"]
authors = [
    { name = "Gijs Vermariën", email = "vermarien@strw.leidenuniv.nl" },
    { name = "Marcus Keil" },
    { name = "Jon Holdship" },
    { name = "Tomas James" },
    { name = "Ross O'Donoghue" },
]
maintainers = [
	{name="Gijs Vermariën", email="vermarien@strw.leidenuniv.nl"},
]
license = {text = "MIT License"}
description = "A package for the astrochemical modelling of gas-grain chemistries."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "h5py", "pandas", "numpy", "pyyaml", "matplotlib", "xarray", "pydantic>=2.0"
]

[project.urls]
Repository = "https://github.com/uclchem/UCLCHEM"
Documentation = "https://uclchem.github.io"

[project.scripts]
uclchem-generate-metadata = "uclchem.advanced.generate_metadata:main"
uclchem-makerates = "uclchem.makerates.cli:main"

[project.optional-dependencies]
dev = [
    "pytest", "pytest-timeout", "pytest-xdist", "pytest-github-actions-annotate-failures", # Testing
    "sphinx", # Documentation
    "pre-commit", "ruff", "pymend", "fortitude-lint", # Style checking
]
docs = ["pydoc-markdown", "jupyter", "jupyter_contrib_nbextensions", "notebook<7"]

[tool.ruff]
# Exclude notebooks directory from most checks since they're generated from .ipynb
extend-exclude = ["notebooks/*.py"]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D", "B", "A",
    "ANN001", "ANN201", 
    "ARG", 
    "RUF", 
    "UP", 
    "DOC", "D",
    "SIM", "S", 
    "EM", 
    "ERA", 
    "N", 
    "PERF", 
    "ICN", 
    "TID", 
    "PTH", 
    "LOG", 
    "TC", 
    "PLC", "PLR", "PLE",
    "FURB",
    "NPY",
    "PIE",
    "PYI",
    "PT",
    "PD",
    "FBT",
    "ICN",
    "RET",
    "FLY",
]
extend-ignore = [
    "E501", "E731", "E741", "E402", "E203", "E204",
    "SIM108", "SIM102", 
    "S603", "S607", "S404", "S602", 
    "PLR0911", "PLR1702", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR0914", "PLR0904",
    "RUF067", "RUF201",
    "PT003", # More verbose scope definition
    "PYI041", # More verbose type hints
    "RET504", # Allows for naming the returned variable in the docstring
]
pycodestyle.max-doc-length = 100
pydocstyle.convention = 'numpy'
preview = true

[tool.ruff.lint.per-file-ignores]
# E402: Module level import not at top of file - normal for notebook-derived files
"notebooks/*.py" = ["E402"]
"*/__init__.py" = ["F401"]
"tests/*" = ["ANN001", "ANN201", "D", "ARG001", "PLR6301", "ARG002", "DOC", "S101", "B011", "PLC", "PLR"]
# Physics/math symbol and domain-acronym names that intentionally deviate from
# snake_case, matching the science literature / chemistry conventions:
#   N806 local vars (T, Av, NH, ...), N802 funcs (get_Ix, to_UCL_format,
#   get_protostellar_Teff, _add_CRP_and_PHOTO_*), N803 args (Ix/Iy/Iz, L_star,
#   coldens_H/H2/CO/C, ...), N807 internal __dunder__ helpers in functional.
"src/uclchem/makerates/io_functions.py" = ["N806"]
"src/uclchem/analysis.py" = ["N806"]
"src/uclchem/utils.py" = ["N806", "N802", "N803"]
"src/uclchem/model.py" = ["N806", "N803"]
"src/uclchem/makerates/reaction.py" = ["N802"]
"src/uclchem/makerates/species.py" = ["N802", "N803", "N816"]
"src/uclchem/makerates/network_builder.py" = ["N802"]
"src/uclchem/functional.py" = ["N807"]


[tool.typos.files]
extend-exclude = [
    # Do not bother checking DVODE
    "**/dvode.f90", 

    # Do not check databases
    "**/*.dat", 
    "**/*.csv", 
    "**/*.html", 
    "**/*.in", 

    # Do not check fortran metadata
    "**/fortran_metadata.yaml", 

    # This file contains species names that might be picked up as typos
    "Makerates/enthalpy_routines/species_matching_session.yaml",

    # Working notes that intentionally list misspellings as before/after examples.
    "precommit_instructions.md",
    "pymend_instructions.md",
    "pre_commit_output.txt"]

[tool.typos.default]
locale = "en-us"
extend-ignore-re = [
    # Ignore lines that end with `# spellchecker:disable-line`
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    # Ignore the line after `# spellchecker:ignore-next-line`:
    "(#|//)\\s*spellchecker:ignore-next-line\\n.*",
    # Ignore blocks between `# spellchecker:off` and `# spellchecker:on`
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]
extend-ignore-identifiers-re = [
    "I[xyzXYZ]$",
    "Indx$",
    "indx$",

    # Multiple Fortran "PARAMETER"s
    "^PARAMETERs$",

    # np.arange
    "^arange$",

    # Ignore f then one or two chars indicating elemental abundances, e.g. fO.
    "^f.{1,2}$",
    
    # Ignore n and then one or two chars indicating index or density
    "^n.{1,2}$",
]

[tool.typos.default.extend-words]
LAMDA = "LAMDA"
atct = "atct"
ATcT = "ATcT"
# Physics variable name (inner radius) used in Fortran and Python sources.
rin = "rin"

[tool.mypy]
# Notebooks are generated from .ipynb sources; type-check the library, not the
# generated example scripts.
exclude = ["^notebooks/"]

[[tool.mypy.overrides]]
module = ["yaml", "uclchemwrap", "h5py", "nbconvert.*", "nbformat", "pytest", "matplotlib", "matplotlib.*", "bs4", "pydantic", "uclchem._project_root"]
ignore_missing_imports = true

[tool.pymend]
output-style = "numpydoc"
exclude = "tests/"
force-multiline-docs-end-with-blank = true
force-docstrings = false
force-raises = 'per-type'
mode = 'check-only'

[tool.ty.analysis]
allowed-unresolved-imports = ["uclchemwrap", "uclchem._project_root"]

[[tool.ty.overrides]]
include = ["tests/"]

[tool.ty.overrides.rules]
possibly-missing-submodule = "ignore"

[tool.fortitude.check]
select = ["E", "C", "OB", "MOD", "S", "PORT", "FORT"]
line-length = 131
exclude = [
    "src/uclchem/makerates/fortran_templates/f2py_constants.f90",
    "src/fortran_src/dvode.f90",
    "src/fortran_src/jacobian.f90"
]
target-std = "f95"
ignore = [
    "MOD011", # Does not work with crackfortran (needed by f2py)
    "S002", "S901", "S902", 
    "C132", "C181", "C183",
] 
line-too-long.ignore-comments = true
preview = true
use-statements.allow-bare-use = ['defaultparameters', 'physicscore']
