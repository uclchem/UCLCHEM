name: Check (Fortran Metadata)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/fortran_src/**/*.f90'
      - 'src/uclchem/advanced/fortran_metadata.yaml'
      - 'src/uclchem/advanced/generate_metadata.py'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/fortran_src/**/*.f90'
      - 'src/uclchem/advanced/fortran_metadata.yaml'
      - 'src/uclchem/advanced/generate_metadata.py'

concurrency:
  group: check-fortran-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-uclchem
      - name: "[check:fortran] Validate Fortran metadata is up to date"
        run: | 
          python3 src/uclchem/advanced/generate_metadata.py --check
